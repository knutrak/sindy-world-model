# The frozen equation-discovery pipeline for the generalisation test (docs/generalisation/00_plan.md).
# Frozen 20 Nov after WP4/WP5 on val, BEFORE any held-out set is read. Code: src/sindy_wm/models/pipeline.py.
pipeline:
  withdraw: rule          # Blue units don't fire while withdrawing (decision rule D1: tie 1.5 / 1.5 -> rule)
  alloc: rule             # target choice: proportional to the target side's type shares (no fitted numbers)
  thr_health: 0.15        # STLSQ threshold, standardised features
  thr_distance: 0.05
  max_reach: 6.0          # SMAClite AGENT_TARGET_RANGE; pair reach = min(attack range + radii, 6)
  savgol_window: 9        # rates, per battle
  reach_offset_tau_s: 1.0
  movement_wd: rule       # amended 21 Nov after the val dry run: withdraw movement by the scripts' rule
                          # (danger*wd, walk_r*wd), no fitted withdraw gate (docs/generalisation/05_withdraw_movement.md)
data: "each scenario's train set only (scripts/build_typed_states.py)"
scenarios:
  # withdraw_radius: the scripts' setting (collect_intents 7.0; collect_marauders 7 x 7.125 / 5.75; collect_mixed 8)
  marines:   {experiment: exp06_intents,   types: [MARINE],           held_out: test4, withdraw_radius: 7.0}
  marauders: {experiment: exp09_marauders, types: [MARAUDER],         held_out: test,  withdraw_radius: 8.674}
  mixed:     {experiment: exp08_mixed,     types: [MARINE, MARAUDER], held_out: test3, withdraw_radius: 8.0}
  uneven:    {experiment: exp10_uneven,    types: [MARINE, MARAUDER], held_out: test,  withdraw_radius: 8.0, fitted_on: mixed}
