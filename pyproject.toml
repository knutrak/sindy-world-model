[project]
name = "sindy-wm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Knut", email = "knut.raknes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pysindy>=2.1.0",
    "pyyaml>=6.0.3",
    "smaclite",
]

[project.scripts]
sindy-wm = "sindy_wm:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = ["rtree>=1.1"]

[tool.uv.sources]
smaclite = { git = "https://github.com/uoe-agents/smaclite", rev = "0d6abbea1334011984ae4704a0ef7a33c36057d6" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
